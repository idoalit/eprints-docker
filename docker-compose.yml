services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: eprints
      MARIADB_USER: eprints
      MARIADB_PASSWORD: eprints
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  eprints:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      EPRINTS_ARCHIVE_ID: kariadi
      EPRINTS_HOST: 123.231.148.148
      EPRINTS_PORT: "8080"
      # Isi jika proxy publik memakai HTTPS:
      # EPRINTS_SECUREHOST: 123.231.148.148
      # EPRINTS_SECUREPORT: "443"
      EPRINTS_ARCHIVE_NAME: Repository Kariadi
      EPRINTS_ORG_NAME: Kariadi
      EPRINTS_ADMIN_EMAIL: admin@localhost
      EPRINTS_ADMIN_USER: admin
      EPRINTS_ADMIN_PASS: admin12345
      DB_HOST: db
      DB_NAME: eprints
      DB_USER: eprints
      DB_PASS: eprints
    ports:
      - "8080:8080"
    volumes:
      - eprints_archives:/opt/eprints3/archives

volumes:
  db_data:
  eprints_archives:
